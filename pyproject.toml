[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "config_resolver"
dynamic = ["version"]
description = "Unmaintained: load INI/JSON config files from XDG locations."
readme = "README.rst"
authors = [{ name = "Michel Albert", email = "michel@albert.lu" }]
license = { text = "MIT" }
requires-python = ">=3.6"
dependencies = ["packaging"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://config-resolver.readthedocs.io/en/stable/"
Changelog = "https://config-resolver.readthedocs.io/en/stable/changelog.html"
Issues = "https://github.com/exhuma/config_resolver/issues"
Repository = "https://github.com/exhuma/config_resolver"

[tool.setuptools.dynamic]
version = { file = "config_resolver/version.txt" }

[tool.setuptools.packages.find]
include = ["config_resolver*"]

[tool.setuptools.package-data]
config_resolver = ["py.typed"]

[dependency-groups]
dev = [
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.uv.dependency-groups]
# Current dev tooling no longer supports the package's Python floor. This
# only restricts the development environment, not the published package.
dev = { requires-python = ">=3.10" }

[tool.black]
line_length = 80

[tool.isort]
profile = "black"
line_length = 80
virtual_env = "env"

[tool.pylint."messages control"]
disable = ["C0330", "C0326"]

[tool.pylint.format]
max-line-length = "80"
